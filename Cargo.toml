[package]
name = "devclean"
version = "0.1.0"
edition = "2021"
authors = ["devclean team"]
description = "Safely scan and clean build artifacts, caches, and temporary files to OS trash."

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
ignore = "0.4"
globset = "0.4"
same-file = "1.0"
trash = "5.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ctrlc = "3.4"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3.16"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
] }
